name: en_es_head_dir
output_root: results/experiments
runner: intervention.run_pilot
models:
  qwen25: Qwen/Qwen2.5-1.5B
defaults:
  dtype: float32
  n_fit: 200
  n_eval: 200
  n_ppl: 200
  max_new_tokens: 60
  batch_size: 32
  resid_own_coefs: [-1]
  head_coefs: [-1, -3, -10, -20]
  n_random: 10
  n_nearby: 5
  seed: 0
  on_missing_heads: error
  model_dir: qwen2.5-1.5b
  heads_json: discovery/{model_dir}/results/{model}_en_{lang}_heads.json
matrix:
  model: [qwen25]
  lang: [es]
  head_dir: [pc1, own]
overrides:
  - match: {head_dir: own}
    set: {head_coefs: [-1, -2, -4]}

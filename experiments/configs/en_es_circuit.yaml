name: en_es_circuit
output_root: results/experiments
runner: intervention.run_pilot
models:
  qwen25: Qwen/Qwen2.5-1.5B
defaults:
  dtype: float32
  n_fit: 200
  n_eval: 200
  n_ppl: 200
  max_new_tokens: 60
  batch_size: 32
  steer_layers: [26, 27]
  resid_coefs: [-2.8, -1, 1]
  resid_own_coefs: [-1]
  head_coefs: [-1, -3, -10]
  n_random: 10
  n_nearby: 5
  on_missing_heads: error
  heads_json: discovery/qwen2.5-1.5b/results/qwen25_en_{lang}_heads.json
matrix:
  model: [qwen25]
  lang: [es]
  seed: [0, 1, 2]
